<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        
        .main{
            width: 100vw;
            height: 100vh;
            background-color: #3f3f33;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1{
            margin: 50px;
            margin-bottom: 80px;
        }
        
        .timer{
            font-weight: bold;
            font-size: 50px;
        }
        .btns{
            margin: 20px;
        }

        button{
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 9px;
            border: none;
            cursor: pointer;
            margin: 0 4px;
        }

        button:hover {
            opacity: 0.9;
        }

        .laps {
            margin-top: 20px;
            text-align: center;
            width: 500px;
            overflow-y: auto;
        }

        .laps div{
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            max-height: 350px;
            width: 500px;
            background-color: white;
            border-radius: 10px;
            overflow-y: auto;
        }
        
        .laps ul {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .laps li {
            margin: 5px;
            color: black;
            padding: 6px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>StopWatch</h1>
        <p class="timer">00:00:00:00</p>
        <div class="btns">
            <button class="start">Start</button>
            <button class="stop">Stop</button>
            <button class="reset">Reset</button>
            <button class="lap">Lap</button>
        </div>
        <div class="laps">
            <h3>Laps</h3>
            <div>
                <ul class="ul"></ul>
            </div>
        </div>
    </div>

    <script>
        const display = document.querySelector(".timer");
        const start = document.querySelector(".start");
        const stop = document.querySelector(".stop");
        const reset = document.querySelector(".reset");
        const lap = document.querySelector(".lap");
        const ul = document.querySelector(".ul");

        let hr = 0;
        let min = 0;
        let sec = 0;
        let ms = 0;
        let timer = null;
        let lapCount = 1;

        function updateDisplay() {
            let h = hr < 10 ? "0" + hr : hr;
            let m = min < 10 ? "0" + min : min;
            let s = sec < 10 ? "0" + sec : sec;
            let msFormatted = ms < 10 ? "0" + ms : ms;

            display.textContent = `${h}:${m}:${s}:${msFormatted}`;
        }

        function runTimer() {
            ms++;
            if (ms === 100) {
                sec++;
                ms = 0;
            }
            if (sec === 60) {
                min++;
                sec = 0;
            }
            if (min === 60) {
                hr++;
                min = 0;
            }
            updateDisplay();
        }

        start.addEventListener("click", function() {
            if (timer !== null) {
                clearInterval(timer);
            }
            timer = setInterval(runTimer, 10);
        });

        stop.addEventListener("click", function() {
            clearInterval(timer);
            timer = null;
        });

        reset.addEventListener("click", function() {
            clearInterval(timer);
            timer = null;
            hr = 0;
            min = 0;
            sec = 0;
            ms = 0;
            lapCount = 1;
            updateDisplay();
            ul.innerHTML = "";
        });

        lap.addEventListener("click", function() {
            if (timer !== null) {
                const li = document.createElement("li");
                li.textContent = `Lap ${lapCount++}: ${display.textContent}`;
                ul.append(li);
            }
        });
    </script>
</body>
</html>
